[package]
name = "aion2-meter"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Standalone AION 2 damage meter for Linux: packet capture, in-game overlay, web dashboard and run history"
repository = "https://github.com/feroxtwo/damage-meter"
rust-version = "1.88"

[dependencies]
# Packet parser and combat aggregation from A2Tools DPS Meter (GPL-3.0),
# Vendored without its desktop half, with explicit i64/observation patches.
# Update the source snapshot and NOTICE together after replay verification.
a2tools-dps-meter = { path = "vendor/a2tools-core", default-features = false }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.32", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["webp"] }
libc = "0.2"
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true

[workspace]
members = ["vendor/a2tools-core"]
default-members = ["."]
resolver = "3"
