[package]
name = "aion2-meter"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Standalone AION 2 damage meter for Linux: packet capture, in-game overlay, web dashboard and run history"
repository = "https://github.com/feroxtwo/damage-meter"
rust-version = "1.88"

[dependencies]
# Packet parser and combat aggregation from A2Tools DPS Meter (GPL-3.0),
# built without its Tauri desktop half. Bump `rev` after a game patch.
a2tools-dps-meter = { git = "https://github.com/taengu/A2Tools-DPS-Meter.git", rev = "1f3a1777f43088da8e7c8915c841a0f50afe72e3", default-features = false }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.32", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
libc = "0.2"
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
