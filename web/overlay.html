<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AION2 Meter Overlay</title>
<style>
:root { --gladiator: #d7925d; --templar: #d6b65c; --ranger: #78ba54; --assassin: #c85ac8; --sorcerer: #5896ec;
  --cleric: #ececec; --elementalist: #966ee6; --chanter: #5ad2c8; --fighter: #dc5050; --unknown: #787882; }
html, body { margin: 0; background: transparent; color: #edf3fb; font: 13px system-ui, sans-serif; text-shadow: 0 1px 2px #000; }
.box { width: 360px; border: 1px solid #7898b633; border-radius: 10px; overflow: hidden; transform-origin: top left; }
.head { padding: 9px 10px; background: var(--header,#101c2c80); display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--title,#edc57b); }
#t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.hp { height: 4px; margin: 0 10px 6px; background: #0005; border-radius: 3px; overflow: hidden; } .hp div { height: 100%; background: #ff7d89; }
.row { position: relative; min-height: 26px; margin: 3px 6px; background: #0003; border-radius: 4px; overflow: hidden; }
.row.me { outline: 1px solid #edc57b88; }
.row .f { position: absolute; inset: 0 auto 0 0; opacity: .4; }
.row .t { position: relative; display: flex; justify-content: space-between; gap: 8px; padding: 4px 7px; }
.row .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.n { font-family: ui-monospace, monospace; font-size: 11px; white-space: nowrap; }
.empty { padding: 10px; text-align: center; font-size: 12px; color: #a0afc3; }
.foot { padding: 6px 10px; display: flex; justify-content: space-between; color: #a0afc3; font-size: 10px; background: var(--header,#101c2c80); }
.compact .row {min-height:22px;margin:2px 6px} .compact .row .t {padding:2px 7px}
/* Same hierarchy as the existing native window; OBS remains its own surface. */
.box {border-radius:7px;border-color:#ffffff20;box-shadow:0 2px 8px #0003}
.head {padding:5px 10px 0;gap:8px}.head #t{font-weight:600;font-size:12px}.head #t::before{content:"A2 ";font-size:9px;font-family:ui-monospace,monospace;color:#5bd5de;margin-right:8px}.head #time{color:#edf3fb}
.group-line {padding:0 10px 5px;font-size:10px;color:#c4cedb;background:var(--header,#101c2c80)}
.row {min-height:30px;border-radius:3px;margin:2px 4px;background:#0007}.row.me{outline:1px solid color-mix(in srgb,var(--title) 55%,transparent);background:#0009}
.row .f {inset:auto auto 0 0;height:2px;opacity:.85}.row .t{align-items:center;padding:2px 6px;gap:6px}.row .name{min-width:0;flex:1}
.row .n {display:flex;flex-direction:column;text-align:right;font-family:system-ui;font-variant-numeric:tabular-nums;line-height:1.2}.row .n strong{font-size:13px;font-weight:700}.row .n small{font-size:9px;color:#bdc8d7}
.row.dead{color:#a6aebb}.row.dead .f{opacity:.4}.foot{padding:3px 10px}.foot #state{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compact .box{width:312px}.compact .row{margin:2px 4px;min-height:22px}.compact .row .t{padding:1px 6px}.compact .row .n{flex-direction:row;align-items:baseline;gap:8px}.compact .row img{width:16px!important;height:16px!important}

/* Match the native instrument: rank, local value plate, open rows, own edge. */
.box{border:0;border-radius:6px}.head{border-top:2px solid #5bd5de;margin:0 6px;padding-inline:4px;background:none}.group-line{background:none}
.row{background:none;border-radius:0;margin:3px 6px;min-height:38px}.row.me{outline:0;box-shadow:inset 2px 0 var(--title);background:#ffffff09}.row .t{padding:4px 6px;gap:8px}.row .f{left:40px;max-width:calc(100% - 46px)}
.row .n{background:#0005;padding:2px 4px}.row .n strong{font-family:ui-monospace,monospace;font-size:14px}.row .name{font-size:12px}.compact .row{min-height:28px}.compact .row .n small{display:none}.compact .row .n{padding:2px 4px}.compact .row .t{padding:2px 6px}
.foot{background:none;border-top:1px solid #ffffff12}
</style>
</head>
<body>
<div class="box" id="box"><div class="head"><span id="t">Kein Ziel</span><span class="n" id="time">0:00</span></div><div class="group-line" id="groupRate"></div>
<div class="hp" id="hpTrack" hidden><div id="hp" style="width:0"></div></div><div id="rows"></div>
<div class="foot"><span id="state">Warte auf Meter …</span><span id="ping" class="n"></span></div></div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v) => v >= 1e6 ? (v/1e6).toFixed(2) + 'M' : v >= 1e3 ? (v/1e3).toFixed(1) + 'K' : Math.round(v || 0);
const dur = (ms) => { const s = Math.max(0, Math.round((ms || 0) / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const masked = name => { const c = Array.from(name || ''); return c.length <= 2 ? '*'.repeat(c.length) : c[0] + '*'.repeat(Math.min(c.length - 2, 4)) + c[c.length - 1]; };
const el = id => document.getElementById(id);
function appearance(s) {
  const colors={midnight:['11,16,24','#edc57b','16,28,44'],aether:['8,26,32','#f0dcaa','16,41,48'],ember:['25,17,21','#f4d8a7','42,29,36']}[s.theme]||['11,16,24','#edc57b','16,28,44'];
  el('box').style.background=`rgba(${colors[0]},${clamp(s.opacity,0,1)})`;
  document.documentElement.style.setProperty('--title',colors[1]);
  document.documentElement.style.setProperty('--header',`rgba(${colors[2]},.7)`);
  document.documentElement.classList.toggle('compact',Boolean(s.compact));
}
const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
async function tick() {
  try {
    const response = await fetch('/api/live', { cache: 'no-store', signal: AbortSignal.timeout(4000) });
    if (!response.ok) throw new Error(response.status);
    const l = await response.json(), s = l.overlay;
    el('box').hidden = !s.visible;
    appearance(s);
    el('box').style.transform = `scale(${clamp(s.scale, .6, 2.5)})`;
    el('t').textContent = (s.metric==='heal'?'Heilung · ':s.metric==='damage_received'?'Erlitten · ':'')+(l.target_name || 'Kein Ziel');
    el('hpTrack').title=l.hp_estimated?'HP geschätzt':'Gemeldete HP';
    el('time').textContent = dur(l.battle_time_ms);
    el('hpTrack').hidden = l.target_hp == null;
    el('hp').style.width = (clamp(l.target_hp ?? 0, 0, 1) * 100) + '%';
    const metric = ['damage','heal','damage_received'].includes(s.metric) ? s.metric : 'damage';
    const ranked = l.rows.map(r=>({...r, value:Number(r[metric])||0})).sort((a,b)=>b.value-a.value).map((r,i)=>({...r,rank:i+1}));
    const selected=ranked.slice(0,clamp(s.max_rows,1,24));
    const me=ranked.find(r=>r.is_self);
    if(s.pin_self!==false && me && !selected.some(r=>r.is_self)) {selected.pop();selected.push(me);}
    const top = Math.max(1, ...ranked.map(r => r.value)), sum=ranked.reduce((n,r)=>n+r.value,0)||1;
    el('groupRate').textContent='Gruppe · '+num(ranked.reduce((n,r)=>n+r.value,0)*1000/Math.max(l.battle_time_ms,1000))+' '+(metric==='heal'?'HPS':metric==='damage_received'?'erlitten/s':'DPS');
    el('rows').innerHTML = selected.map((r, i) => {
      const key = /^[a-z]+$/.test(r.class_key) ? r.class_key : 'unknown';
      const name = s.hide_names && !r.is_self ? masked(r.name) : r.name;
      const rate=metric==='heal'?r.hps:metric==='damage_received'?r.value*1000/Math.max(l.battle_time_ms,1000):r.dps;
      return `<div class="row ${r.is_self ? 'me' : ''} ${r.dead?'dead':''}">
      <div class="f" style="width:${clamp(r.value / top * 100, 0, 100)}%;background:var(--${key})"></div>
      <div class="t"><span class="name">${["gladiator","templar","assassin","ranger","sorcerer","elementalist","cleric","chanter","fighter"].includes(key)?`<img src="/assets/icons/class-${key}.webp" alt="" style="width:18px;height:18px;vertical-align:middle;margin-right:5px">`:""}${r.rank}. ${r.dead ? '† ' : ''}${esc(name)}</span><span class="n"><strong>${s.show_dps?num(rate)+'/s':num(r.value)}</strong><small>${!s.compact&&s.show_dps?num(r.value)+' · ':''}${(r.value*100/sum).toFixed(0)}%</small></span></div></div>`;
    }).join('') || '<div class="empty">Warte auf Kampf …</div>';
    const c = l.capture;
    el('state').textContent = c.error ? 'Capture-Fehler' : !c.permission ? 'Keine Capture-Berechtigung' : l.numeric_limited ? 'Zahlengrenze: Näherungswerte' : c.locked_port ? l.dungeon || 'Verbunden' : c.game_running ? 'Suche Verbindung …' : 'AION2 nicht gestartet';
    el('ping').textContent = [c.recording ? '● REC' : '', l.ping_ms != null ? l.ping_ms + ' ms' : ''].filter(Boolean).join(' · ');
  } catch (e) {
    el('state').textContent = 'Meter nicht erreichbar';
    el('rows').replaceChildren(); el('groupRate').textContent=''; el('ping').textContent = ''; el('hpTrack').hidden = true;
  } finally { setTimeout(tick, 500); }
}
tick();
</script>
</body>
</html>
